name: keepalive
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          K="sb_publishable_ndTUVlOvFaFcHtCOQTClcQ_iWJN3W7H"
          curl -fsS "https://lodaopndsdahfcenrzxj.supabase.co/rest/v1/profiles?select=id&limit=1" -H "apikey: $K" > /dev/null
          curl -fsS "https://lodaopndsdahfcenrzxj.supabase.co/functions/v1/wx?ids=LTFM" -H "apikey: $K" > /dev/null
          curl -fsS "https://squawk-app.github.io/" > /dev/null
      - name: Repo heartbeat (keeps schedules enabled)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$(date -u +%d)" = "01" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "heartbeat" || exit 0
            git push
          fi
