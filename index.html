<style>
:root{--ac:#ffb020;--ac-ink:#14100a;--red:#ff5c7a;--green:#3ddc97;--blue:#5aa9ff;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
html[data-t="dark"]{--bg:#070b14;--panel:#0d1525;--panel2:#142036;--line:#1d2c47;--text:#e6ecf8;--muted:#7f8fae;--grid:rgba(120,160,255,.04);--glow:rgba(255,176,32,.08);--shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark}
html[data-t="light"]{--bg:#f1ede2;--panel:#fbf9f2;--panel2:#ebe6d6;--line:#d6cfb8;--text:#14213a;--muted:#667189;--grid:rgba(20,33,58,.05);--glow:rgba(255,176,32,.18);--shadow:0 10px 30px rgba(60,50,20,.15);--red:#d6264a;--green:#0f9b6c;--blue:#1d6fd0;color-scheme:light}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}input,textarea,select{font-size:16px}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body{background-image:radial-gradient(circle at 88% -8%,var(--glow) 0,transparent 42%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,34px 34px,34px 34px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
a{color:inherit}
.i{display:inline-block;vertical-align:middle;flex:0 0 auto}
.mono{font-family:var(--mono)}
#app{max-width:1200px;margin:0 auto;min-height:100vh}
.radar{position:relative;width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);flex:0 0 auto;overflow:hidden}
.radar:before{content:"";position:absolute;inset:22%;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ac) 55%,transparent)}
.radar:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 62%,color-mix(in srgb,var(--ac) 75%,transparent) 100%);animation:sweep 2.8s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes blip{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.wm{font-weight:900;letter-spacing:.22em;font-size:21px}
.loadr{display:flex;align-items:center;justify-content:center;gap:12px;padding:50px;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:30px;padding:30px}
.hero{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.bigradar{position:relative;width:min(380px,80vw);aspect-ratio:1;border-radius:50%;border:2px solid var(--ac);background:
repeating-radial-gradient(circle,transparent 0 46px,var(--line) 47px 48px),
linear-gradient(90deg,transparent calc(50% - .5px),var(--line) 0 calc(50% + .5px),transparent 0),
linear-gradient(0deg,transparent calc(50% - .5px),var(--line) 0 calc(50% + .5px),transparent 0),var(--panel);overflow:hidden;box-shadow:0 0 60px var(--glow)}
.bigradar:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,var(--ac) 55%,transparent) 100%);animation:sweep 4.5s linear infinite}
.bp{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac);animation:blip 3s infinite;z-index:2}
.bp i{position:absolute;left:12px;top:-4px;font:normal 10px var(--mono);color:var(--ac);white-space:nowrap;letter-spacing:.05em}
.hero h2{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.hero h2 em{font-style:normal;color:var(--ac)}
.hero p{margin:0;color:var(--muted);max-width:420px}
.auth-card{width:100%;max-width:430px;justify-self:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow small{display:block;font:11px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.auth h2{margin:18px 0 4px;font-size:18px}
.auth-card p{margin:0 0 14px;color:var(--muted);font-size:13px}
.field{display:block;margin-bottom:12px;position:relative}
.field>span{display:block;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.pw{position:relative}.pw input{padding-right:42px}
.eye{position:absolute;right:4px;top:3px;width:36px;height:34px;color:var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center}
.eye:hover{color:var(--ac)}
.meter{display:flex;gap:4px;margin-top:6px}.meter i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.meter small{font:10px var(--mono);color:var(--muted);margin-left:6px;align-self:center;min-width:46px}
.hintm{font-size:12px;margin-top:4px}.hintm.bad{color:var(--red)}.hintm.ok{color:var(--green)}
.btn{background:var(--ac);color:var(--ac-ink);font-weight:800;border-radius:999px;padding:10px 18px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{background:var(--panel2);filter:none}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.full{width:100%}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.okmsg{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
.lnk{color:var(--ac);cursor:pointer;background:none;font-size:inherit}.lnk:hover{text-decoration:underline}
.shell{display:grid;grid-template-columns:250px minmax(0,610px) 320px;justify-content:center}
.side{position:sticky;top:0;height:100vh;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.side .brandrow{padding:6px 12px 16px}
.nav a{position:relative;display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;font-size:16px;cursor:pointer;color:var(--muted);font-weight:600}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a.on{color:var(--text);background:var(--panel)}
.nav a.on:before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.nav a.on .i{color:var(--ac)}
.badge{background:var(--ac);color:var(--ac-ink);border-radius:999px;font:800 11px var(--mono);padding:1px 7px;margin-left:auto}
.side .btn{margin:12px 6px;padding:13px;font-size:15px}
.me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer}
.me-chip:hover{background:var(--panel)}
.me-chip b{display:block;font-size:14px}.me-chip small{color:var(--muted)}
main{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh;min-width:0;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.right{padding:14px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.box h3{margin:0 0 10px;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.trend{display:block;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.trend:first-of-type{border-top:0}.trend b{display:block;color:var(--ac)}.trend small{color:var(--muted);font-family:var(--mono);font-size:11px}
.suggest{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.suggest:first-of-type{border-top:0}.suggest .grow{flex:1;min-width:0;cursor:pointer}
.suggest b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.suggest small{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:19px;padding:14px 16px;display:flex;align-items:center;gap:10px}
.topbar h1 small{font:11px var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:400}
.topbar .back{display:flex;align-items:center}.topbar .back button{padding:14px 6px 14px 16px;color:var(--ac)}
.topbar .back h1{padding-left:8px}
.tabs{display:flex}.tabs button{flex:1;padding:12px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;font-size:14px}
.tabs button.on{color:var(--text);border-bottom-color:var(--ac)}.tabs button:hover{background:var(--panel)}
.composer{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.composer textarea{flex:1;background:transparent;border:0;outline:none;resize:none;font-size:18px;min-height:64px;width:100%}
.composer .row{display:flex;align-items:center;gap:10px;margin-top:6px}
.composer .row .sp{flex:1}
.tool{width:36px;height:36px;border-radius:50%;color:var(--ac);display:flex;align-items:center;justify-content:center}.tool:hover{background:var(--panel2)}
.ring{width:26px;height:26px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .1s}
.cn{font:12px var(--mono);color:var(--muted);min-width:26px;text-align:right}.cn.warn{color:var(--ac)}.cn.over{color:var(--red)}
.attach{position:relative;margin-top:8px;display:inline-block}
.attach img{max-height:220px;max-width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.attach button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center}
.av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a1020;font-size:16px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--rc,var(--ac));overflow:hidden;cursor:pointer;margin:2px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:86px;height:86px;font-size:32px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--rc,var(--ac))}
.av.sm{width:34px;height:34px;font-size:13px}
.post{position:relative;display:flex;gap:12px;padding:14px 16px 12px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid var(--rc,var(--ac))}
.post:hover{background:color-mix(in srgb,var(--panel) 70%,transparent)}
.post .body{flex:1;min-width:0}
.post .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.post .head b{font-size:15px;cursor:pointer}.post .head .h{color:var(--muted)}.post .head .t{color:var(--muted);font:12px var(--mono)}
.more{margin-left:auto;color:var(--muted);width:30px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center}.more:hover{background:var(--panel2);color:var(--text)}
.role{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.vb{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;margin-left:1px}
.vb svg{width:10px;height:10px;stroke-width:3.4}
.text{margin:4px 0 8px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font-size:15.5px}
.tag,.mention{color:var(--blue);cursor:pointer}.tag:hover,.mention:hover{text-decoration:underline}
.pimg{display:block;max-width:100%;max-height:420px;border-radius:14px;border:1px solid var(--line);margin:2px 0 8px;cursor:zoom-in;object-fit:cover}
.replying{font:11px var(--mono);color:var(--muted);letter-spacing:.06em;margin-top:2px}
.pinned{font:11px var(--mono);color:var(--muted);letter-spacing:.08em;padding:8px 16px 0;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.acts{display:flex;gap:4px;align-items:center}
.acts button{display:flex;align-items:center;gap:6px;color:var(--muted);padding:4px 10px 4px 6px;border-radius:999px;font:13px var(--mono)}
.acts button:hover{background:var(--panel2);color:var(--text)}
.acts .like.on{color:var(--red)}.acts .like.on svg{fill:var(--red)}
.acts .rp.on{color:var(--green)}.acts .bm.on{color:var(--ac)}.acts .bm.on svg{fill:var(--ac)}
.acts .sq{margin-left:auto;font:10px var(--mono);letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px;pointer-events:none}
.post.big{cursor:default;flex-direction:column;gap:0}
.post.big .text{font-size:19px}
.post.big .meta{color:var(--muted);font:12px var(--mono);padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
.post.big .top{display:flex;gap:12px;align-items:center}
.banner{height:120px;position:relative}
.b-dusk{background:linear-gradient(135deg,#1b2b52,#0f1b36 55%,#6a3b0a)}.b-sky{background:linear-gradient(135deg,#2a6fd6,#7cc4ff 60%,#d6efff)}
.b-radar{background:radial-gradient(circle at 70% 120%,#0f7a4f,#06231a 65%)}.b-sunrise{background:linear-gradient(135deg,#ff7a45,#ffb020 55%,#ffe29a)}
.b-storm{background:linear-gradient(135deg,#232a3c,#4a5675 60%,#8d9bb8)}.b-mint{background:linear-gradient(135deg,#0c5b52,#2fd6a0 70%,#c6ffe8)}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px}
.prof{padding:0 16px 14px;border-bottom:1px solid var(--line)}
.prof .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-46px;position:relative;z-index:2}
.prof .row .btns{display:flex;gap:8px;align-items:center}
.prof h2{margin:12px 0 0;font-size:21px;display:flex;align-items:center;gap:6px}
.prof .h{color:var(--muted)}.prof .bio{margin:8px 0;white-space:pre-wrap}
.prof .info{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:13px;margin:6px 0}
.prof .info span{display:inline-flex;align-items:center;gap:5px}.prof .info a{color:var(--blue)}
.prof .stats{display:flex;gap:18px;color:var(--muted);font-size:14px}.prof .stats b{color:var(--text);font-family:var(--mono)}.prof .stats a{cursor:pointer}.prof .stats a:hover{text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);font:12px var(--mono);letter-spacing:.04em;color:var(--muted);cursor:pointer}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac);font-weight:800}
.search{padding:12px 16px;border-bottom:1px solid var(--line);position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 16px 11px 42px;outline:none}
.search input:focus{border-color:var(--ac)}.search .i{position:absolute;left:30px;top:22px;color:var(--muted)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.lock{padding:44px 20px;text-align:center;color:var(--muted)}.lock .i{color:var(--ac);margin-bottom:8px}
.notif{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.notif.new{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.notif .ic{width:30px;display:flex;justify-content:center;padding-top:4px}
.notif p{margin:2px 0 0;color:var(--muted);font-size:14px}
.urow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.urow .g{flex:1;min-width:0;cursor:pointer}.urow .g b{display:block}.urow .g small{color:var(--muted)}
.card{margin:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 4px;font-size:15px}.card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}.srow .g{flex:1}.srow .g small{display:block;color:var(--muted)}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}

itikası ve KVKK Aydınlatma Metni":"Privacy Policy and Data Protection Notice (KVKK)","Veri sorumlusu Pushback işletmecisidir (iletişim: aşağıdaki şikayet / başvuru kanalı). İşlenen veriler: e-posta, (isteğe bağlı) cep telefonu, kullanıcı adı, görünen ad, rol, unvan, biyografi, profil fotoğrafı, paylaşımların, beğeni / takip / yer imi kayıtları ve teknik kayıtlar. Amaçlar: hesabın oluşturulması ve giriş, platformun işletilmesi, güvenlik ve kötüye kullanımın önlenmesi, yasal yükümlülüklerin yerine getirilmesi. Hukuki sebepler: sözleşmenin ifası, meşru menfaat, hukuki yükümlülük ve gerektiğinde açık rıza (KVKK m.5). Telefon numaran ve e-postan başkalarına gösterilmez. Veriler altyapı sağlayıcıları (Supabase, GitHub Pages) üzerinde işlenir ve yurt dışına aktarılabilir. Verilerin hesap açık kaldığı sürece saklanır; Ayarlar > Hesabımı sil ile tüm verilerin kalıcı olarak silinir. KVKK m.11 uyarınca bilgi talep etme, düzeltme, silme, işlemeye itiraz etme haklarına sahipsin; başvurunu Ayarlar altındaki iletişim kanalından yapabilirsin.":"The data controller is the operator of Pushback (contact: the report / request channel below). Data processed: email, (optionally) mobile phone, username, display name, role, title, biography, profile photo, your posts, like / follow / bookmark records and technical logs. Purposes: creating your account and logging you in, operating the platform, security and abuse prevention, and meeting legal obligations. Legal bases: performance of a contract, legitimate interest, legal obligation and, where needed, explicit consent (KVKK Art. 5). Your phone number and email are not shown to others. Data is processed on infrastructure providers (Supabase, GitHub Pages) and may be transferred abroad. Data is kept as long as your account stays open; Settings > Delete my account permanently deletes all of it. Under KVKK Art. 11 you have the right to request information, correction, deletion and to object to processing; you can apply through the contact channel in Settings.","Topluluk Kuralları":"Community Guidelines","1) Saygılı ol: hakaret, taciz, nefret söylemi yok. 2) Gizlilik: yolcu verisi, şirket sırrı, kişisel veri paylaşma. 3) Emniyet: yanlış veya yanıltıcı emniyet bilgisi yayma; olayları kurum kanalından bildir. 4) Kimlik: başkasını taklit etme, sahte onay iddiası yok. 5) Spam ve reklam yok; ilanlar yalnızca İlanlar bölümünde. 6) Yasa dışı içerik yok. İhlaller şikayet edilir; yönetim içeriği kaldırabilir veya hesabı kısıtlayabilir.":"1) Be respectful: no insults, harassment or hate speech. 2) Privacy: don't share passenger data, company secrets or personal data. 3) Safety: don't spread false or misleading safety information; report events through your organization's channel. 4) Identity: don't impersonate others or make false verification claims. 5) No spam or advertising; listings belong only in the Listings section. 6) No unlawful content. Violations are reported; admins may remove content or restrict the account.","Şikayet ve İçerik Kaldırma":"Reports and Content Removal","Bir paylaşımın ⋯ menüsünden veya profilden “Şikayet et” ile bildirim yapabilirsin. Yönetim bildirimleri inceler; ihlal varsa içerik kaldırılır. 5651 sayılı Kanun kapsamında hakkını ihlal eden içeriğin kaldırılması için içerik bağlantısı, hakkını gösteren açıklama ve kimlik bilgisiyle yönetime başvurabilirsin; geçerli başvurular makul sürede (en geç birkaç iş günü) değerlendirilir. Mahkeme kararları ve yetkili makam talepleri yasal süresinde yerine getirilir.":"You can report content with “Report” from a post's ⋯ menu or from a profile. Admins review reports; content that breaks the rules is removed. Under Turkish Law No. 5651, to request removal of content that infringes your rights, you can apply to the admins with the content link, a statement showing your right and your identity details; valid requests are assessed within a reasonable time (a few business days at most). Court orders and requests from competent authorities are carried out within the legal time limits.","Yasal":"Legal","Bu metinler genel bilgilendirme niteliğindedir; yayına almadan önce bir hukukçuya gözden geçirtilmesi önerilir.":"These texts are for general information only; it is recommended that a lawyer reviews them before publication.","Yer İmleri":"Bookmarks","Kayıtlı":"Saved","Henüz yer imi yok. Bir gönderideki bayrak simgesine dokun.":"No bookmarks yet. Tap the flag icon on a post.","gönderini beğendi":"liked your post","gönderine yanıt verdi":"replied to your post","gönderini yeniden paylaştı":"reposted your post","sana takip isteği gönderdi":"sent you a follow request","Bildirimler":"Notifications","Alıcı":"Receiver","Henüz bildirim yok.":"No notifications yet.","Onayla":"Approve","Reddet":"Decline","Profil":"Profile","Bu kullanıcı bulunamadı.":"This user couldn't be found.","Profili düzenle":"Edit profile","Ayarlar":"Settings","İstek gönderildi":"Request sent","Takip Et":"Follow","tarihinde katıldı":"joined on","Gönderiler":"Posts","Yanıtlar":"Replies","Medya":"Media","Beğeniler":"Likes","Bu hesap gizli":"This account is private","Gönderilerini görmek için takip isteği gönder.":"Send a follow request to see their posts.","Sabitlenmiş":"Pinned","Burada henüz bir şey yok.":"Nothing here yet.","Gizli hesap":"Private account","gönderi":"posts","takipçi bilgisi gizli":"follower info hidden","takipçi":"followers","takip":"following","Takipçiler":"Followers","Takip Edilenler":"Following","Bu kullanıcı listeyi gizledi.":"This user has hidden the list.","Liste boş.":"The list is empty.","Gönderi":"Post","Bu gönderi bulunamadı.":"This post couldn't be found.","Yanıtını yaz…":"Write your reply…","Henüz yanıt yok.":"No replies yet.","İşareti kaldır":"Remove mark","✓ Çözüm olarak işaretle":"✓ Mark as solution","Bu etiketle gönderi yok.":"No posts with this tag.","Fotoğraf seç":"Choose photo","JPG/PNG, otomatik küçültülür.":"JPG/PNG, resized automatically.","Görünen ad":"Display name","örn. Kule Kulağı":"e.g. Tower Ears","Unvan":"Titl terms:["Kullanım Şartları","Pushback, havacılık çalışanları ve meraklıları için bir sosyal ağdır. Hesap açarak bu şartları kabul edersin. 18 yaşından küçükler kullanamaz. Hesabından sen sorumlusun; başkasının kimliğine bürünemezsin. Yasa dışı, nefret içerikli, taciz edici veya yanıltıcı içerik paylaşamazsın. Gizli şirket bilgisi, yolcu verisi, güvenlik açısından hassas operasyonel bilgi ve soruşturma altındaki kaza/olay detayları paylaşılmamalıdır. Pushback'teki hiçbir içerik resmi operasyonel, teknik veya hukuki tavsiye yerine geçmez; hava durumu verileri yalnızca bilgi amaçlıdır. Kuralları ihlal eden içerik kaldırılabilir, hesap kısıtlanabilir veya kapatılabilir. Hizmet olduğu gibi sunulur, kesintisiz çalışacağı garanti edilmez. Şartlar güncellenebilir; önemli değişiklikler uygulama içinden duyurulur."],
privacy:["Gizlilik Politikası ve KVKK Aydınlatma Metni","Veri sorumlusu Pushback işletmecisidir (iletişim: aşağıdaki şikayet / başvuru kanalı). İşlenen veriler: e-posta, (isteğe bağlı) cep telefonu, kullanıcı adı, görünen ad, rol, unvan, biyografi, profil fotoğrafı, paylaşımların, beğeni / takip / yer imi kayıtları ve teknik kayıtlar. Amaçlar: hesabın oluşturulması ve giriş, platformun işletilmesi, güvenlik ve kötüye kullanımın önlenmesi, yasal yükümlülüklerin yerine getirilmesi. Hukuki sebepler: sözleşmenin ifası, meşru menfaat, hukuki yükümlülük ve gerektiğinde açık rıza (KVKK m.5). Telefon numaran ve e-postan başkalarına gösterilmez. Veriler altyapı sağlayıcıları (Supabase, GitHub Pages) üzerinde işlenir ve yurt dışına aktarılabilir. Verilerin hesap açık kaldığı sürece saklanır; Ayarlar > Hesabımı sil ile tüm verilerin kalıcı olarak silinir. KVKK m.11 uyarınca bilgi talep etme, düzeltme, silme, işlemeye itiraz etme haklarına sahipsin; başvurunu Ayarlar altındaki iletişim kanalından yapabilirsin."],
rules:["Topluluk Kuralları","1) Saygılı ol: hakaret, taciz, nefret söylemi yok. 2) Gizlilik: yolcu verisi, şirket sırrı, kişisel veri paylaşma. 3) Emniyet: yanlış veya yanıltıcı emniyet bilgisi yayma; olayları kurum kanalından bildir. 4) Kimlik: başkasını taklit etme, sahte onay iddiası yok. 5) Spam ve reklam yok; ilanlar yalnızca İlanlar bölümünde. 6) Yasa dışı içerik yok. İhlaller şikayet edilir; yönetim içeriği kaldırabilir veya hesabı kısıtlayabilir."],
report:["Şikayet ve İçerik Kaldırma","Bir paylaşımın ⋯ menüsünden veya profilden “Şikayet et” ile bildirim yapabilirsin. Yönetim bildirimleri inceler; ihlal varsa içerik kaldırılır. 5651 sayılı Kanun kapsamında hakkını ihlal eden içeriğin kaldırılması için içerik bağlantısı, hakkını gösteren açıklama ve kimlik bilgisiyle yönetime başvurabilirsin; geçerli başvurular makul sürede (en geç birkaç iş günü) değerlendirilir. Mahkeme kararları ve yetkili makam talepleri yasal süresinde yerine getirilir."]};
return Object.keys(T).map(function(k){return '<div class="card"><h3>'+esc(T[k][0])+'</h3><p class="sub" style="white-space:pre-wrap;line-height:1.55">'+esc(T[k][1])+'</p></div>';}).join("");
}

case "compose":S.stack=[];S.tab="all";S.view="home";S.param=null;resetLists();loadView();setTimeout(function(){var d=document.getElementById("draft");if(d)d.focus();},60);break;

case "pickImg":document.getElementById("fp").click();break;
case "pickAv":document.getElementById("fa").click();break;
case "rmImg":S.img=null;render();break;
case "zoom":S.modal={t:"img",src:el.getAttribute("data-src")};render();break;
case "menu":var p=findPost(id);if(p){S.modal={t:"menu",post:p};render();}break;
case "umenu":S.modal={t:"umenu",u:S.prof};render();break;
case "mEdit":S.mf={text:S.modal.post.t};S.modal={t:"edit",post:S.modal.post};render();setTimeout(function(){var x=document.getElementById("edtxt");if(x)x.focus();},30);break;
case "mPin":doPin(S.me.pinned_post_id===S.modal.post.id?null:S.modal.post.id);break;
case "mDel":S.modal={t:"del",post:S.modal.post};render();break;
case "mReport":S.mf={};S.modal={t:"report",postId:S.modal.post.id};render();break;
case "mReportU":S.mf={};S.modal={t:"report",uid:S.modal.u.id};render();break;
case "mMute":setBlock(id,"mute");break;case "mBlock":setBlock(id,"block");break;case "unblk":setBlock(id,null);break;
case "mClose":S.modal=null;S.mf={};render();break;
case "reason":S.mf.reason=v;render();break;
case "doReport":doReport();break;case "doEdit":doEdit();break;case "doDelete":doDelete();break;
case "delAcct":S.mf={};S.modal={t:"delacct"};render();break;case "doDelAcct":delAccount();break;
case "editProfile":var m=S.me;S.ef={name:m.display_name,role:m.role,bio:m.bio,title:m.title||"",loc:m.location||"",base:m.home_base||"",web:m.website||"",banner:m.banner||"dusk",file:null,prev:null};go("edit");break;
case "saveProfile":saveProfile();break;
case "banner":S.ef.banner=v;render();break;
case "titlePick":S.tq="";S.modal={t:"title"};render();setTimeout(function(){var x=document.getElementById("tq");if(x)x.focus();},30);break;
case "pickTitle":var tt=TITLES[+el.getAttribute("data-i")];S.ef.title=(S.tl==="en"?tt.e:tt.t).slice(0,60);if(TROLE[tt.k])S.ef.role=TROLE[tt.k];S.modal=null;render();break;case "tlang":S.tl=v;render();break;
case "customTitle":S.ef.title=S.tq.trim().slice(0,60);S.modal=null;render();break;
case "clearTitle":S.ef.title="";S.modal=null;render();break;
case "theme":S.theme=v;lsSet("sq_theme",v);applyTheme();render();break;
case "accent":S.accent=v;lsSet("sq_accent",v);applyTheme();render();break;
case "setPrivate":saveSetting("is_private",v==="1");break;
case "setHide":saveSetting("hide_stats",v==="1");break;
case "changePw":changePw();break;case "savePhone":savePhone();break;
case "reqVerify":reqVerify();break;
case "reqOk":answerReq(id,true);break;case "reqNo":answerReq(id,false);break;
case "ptab":S.ptab=v;loadView();break;
case "people":go("people",v);break;
case "atab":S.adm.tab=v;loadView();break;
case "adm":S.modal=null;admAct(el.getAttribute("data-k"),id,el.getAttribute("data-x"));break;
}
}
document.addEventListener("click",function(e){
var t=e.target;
var btn=t.closest("button[data-act]");
if(btn){act(btn);return;}
var tag=t.closest("[data-tag]");if(tag){go("tag",tag.getAttribute("data-tag"));return;}
var icx=t.closest("[data-icao]");if(icx){e.stopPropagation();go("airport",icx.getAttribute("data-icao"));return;}
var us=t.closest("[data-user]");
if(us&&!us.closest('[data-act="nav"]')&&!us.closest(".notif")&&!us.closest("[data-act='follow']")){S.modal=null;go("profile",us.getAttribute("data-user"));return;}
var el=t.closest("[data-act]");
if(el){if(el.hasAttribute("data-ov")&&t!==el)return;act(el);}
});
var searchTimer=null;
function updPw(){
[["password","password2"],["newpw","newpw2"],["cpw","cpw2"]].forEach(function(pr){
var a=document.querySelector('[data-f="'+pr[0]+'"]'),b=document.querySelector('[data-f="'+pr[1]+'"]');
if(a){var la=a.closest("label"),m=la&&la.querySelector(".meter");if(m){var t=document.createElement("div");t.innerHTML=meter(S.form[pr[0]]);m.replaceWith(t.firstChild);L10N(la);}}
if(b){var lb=b.closest("label");if(lb){var h=lb.querySelector(".hintm");if(h)h.remove();var x=matchHint(S.form[pr[0]],S.form[pr[1]]);if(x){var d=document.createElement("div");d.innerHTML=x;lb.appendChild(d.firstChild);L10N(lb);}}}
});
}
document.addEventListener("input",function(e){
var el=e.target,id=el.id,f=el.getAttribute("data-f"),ee=el.getAttribute("data-e"),mm=el.getAttribute("data-m");
if(f){S.form[f]=el.value;if(/^(password2?|newpw2?|cpw2?)$/.test(f))updPw();return;}
if(ee){S.ef[ee]=el.value;if(ee==="role")render();return;}
var jj=el.getAttribute("data-j");if(jj){S.jf[jj]=el.value;return;}
if(mm==="dtopic"){S.dtopic=el.value;return;}
if(mm){S.mf[mm]=el.value;if(mm==="text"){var c=document.getElementById("edcnt");if(c)c.textContent=MAX-el.value.length;}return;}
if(id==="draft"||id==="reply"){
var v=el.value;if(id==="draft")S.draft=v;else S.replyDraft=v;
var n=v.length,c2=document.getElementById(id+"Cnt"),b=document.getElementById(id+"Btn"),rg=document.getElementById("draftRingFg");
if(c2){c2.textContent=MAX-n;c2.className="cn "+(n>MAX?"over":(n>MAX-30?"warn":""));}
if(rg)rg.setAttribute("stroke-dashoffset",Math.max(0,Math.min(62.83,62.83*(1-n/MAX))));
if(b)b.disabled=!v.trim()||n>MAX||S.busy;
}else if(id==="q"){S.q=el.value;clearTimeout(searchTimer);searchTimer=setTimeout(function(){loadView(true);},350);}
else if(id==="uq"){S.adm.uq=el.value;clearTimeout(searchTimer);searchTimer=setTimeout(function(){loadView(true);},350);}
else if(id==="tq"){S.tq=el.value;render();}
});
document.addEventListener("change",function(e){
var el=e.target,f=el.files&&el.files[0];
if(el.id==="fp"||el.id==="fa"){
if(!f)return;
if(!/^image\//.test(f.type)){toast("Lütfen bir görsel seç.");return;}
if(f.size>15*1024*1024){toast("Görsel çok büyük (en fazla 15 MB).");return;}
var url=URL.createObjectURL(f);
if(el.id==="fp"){S.img={file:f,url:url};}else{S.ef.file=f;S.ef.prev=url;}
render();
}
});
document.addEventListener("mousedown",function(e){if(e.target.closest&&e.target.closest(".eye"))e.preventDefault();});
document.addEventListener("keydown",function(e){
if(e.key==="Escape"&&S.modal){S.modal=null;S.mf={};render();return;}
if(e.key==="Enter"&&e.target.getAttribute&&e.target.getAttribute("data-f")&&e.target.tagName==="INPUT"){
e.preventDefault();if(S.recovery)doRecover();else if(S.mode==="forgot")doForgot();else if(S.mode==="register")doRegister();else doLogin();return;}
if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){if(e.target.id==="draft")send(null);if(e.target.id==="reply")send(S.param);}
});
sb.auth.onAuthStateChange(function(ev,session){
setTimeout(function(){
if(ev==="PASSWORD_RECOVERY"){S.recovery=true;S.boot=false;S.authErr="";render();}
if(ev==="SIGNED_OUT")setSession(null);
else if(session&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"))setSession(session);
else if(ev==="INITIAL_SESSION"&&!session)setSession(null);
},0);
});
applyTheme();
render();
})();
</script>
