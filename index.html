<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squawk – Havacıların Frekansı</title>
<meta name="theme-color" content="#0a1020">
<style>
:root{
--bg:#0a1020;--panel:#111a2e;--panel2:#16213a;--line:#223052;
--text:#e8edf7;--muted:#8d9bb8;--amber:#ffb020;--amber2:#ffcb5c;--green:#3ddc97;--red:#ff5c7a;--blue:#5aa9ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text)}
#app{max-width:1180px;margin:0 auto;min-height:100vh}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:28px;letter-spacing:.5px}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
.auth h2{margin:20px 0 4px;font-size:18px}
.auth p{margin:0 0 16px;color:var(--muted);font-size:13px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber)}
.btn{background:var(--amber);color:#1b1300;font-weight:700;border-radius:999px;padding:10px 18px}
.btn:hover{background:var(--amber2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.full{width:100%}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
.shell{display:grid;grid-template-columns:240px minmax(0,600px) 320px;gap:0;justify-content:center}
.side{position:sticky;top:0;height:100vh;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.side .brand{padding:6px 12px 14px;font-size:24px}
.nav a{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:999px;font-size:17px;cursor:pointer;color:var(--text)}
.nav a:hover{background:var(--panel)}
.nav a.on{font-weight:700;color:var(--amber)}
.nav .ico{width:24px;text-align:center;font-size:19px}
.badge{background:var(--amber);color:#1b1300;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:auto}
.side .btn{margin:10px 6px;padding:13px}
.me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer}
.me-chip:hover{background:var(--panel)}
.me-chip b{display:block;font-size:14px}
.me-chip small{color:var(--muted)}
main{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh;min-width:0}
.right{padding:14px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.box h3{margin:0 0 10px;font-size:16px}
.trend{display:block;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.trend:first-of-type{border-top:0}
.trend b{display:block;color:var(--amber)}
.trend small{color:var(--muted)}
.suggest{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.suggest:first-of-type{border-top:0}
.suggest .grow{flex:1;min-width:0;cursor:pointer}
.suggest b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest small{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:5;background:rgba(10,16,32,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:19px;padding:14px 16px}
.topbar .back{display:flex;align-items:center;gap:12px}
.topbar .back button{font-size:20px;padding:12px 4px 12px 16px;color:var(--amber)}
.tabs{display:flex}
.tabs button{flex:1;padding:12px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--amber)}
.tabs button:hover{background:var(--panel)}
.composer{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.composer textarea{flex:1;background:transparent;border:0;outline:none;resize:none;font-size:18px;min-height:64px}
.composer .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.count{font-size:13px;color:var(--muted)}
.count.warn{color:var(--amber)}.count.over{color:var(--red)}
.hint{font-size:12px;color:var(--muted)}
.av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a1020;font-size:15px}
.av.lg{width:78px;height:78px;font-size:28px;border:4px solid var(--bg)}
.av.sm{width:34px;height:34px;font-size:13px}
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.post:hover{background:rgba(255,255,255,.015)}
.post .body{flex:1;min-width:0}
.post .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.post .head b{font-size:15px}
.post .head .h,.post .head .t{color:var(--muted)}
.role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.text{margin:3px 0 8px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font-size:15.5px}
.tag,.mention{color:var(--blue);cursor:pointer}
.tag:hover,.mention:hover{text-decoration:underline}
.replying{font-size:13px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:6px;max-width:420px}
.acts button{flex:1;display:flex;align-items:center;gap:6px;color:var(--muted);padding:4px 6px;border-radius:999px;font-size:14px;justify-content:flex-start}
.acts button:hover{background:var(--panel2)}
.acts .like.on{color:var(--red)}
.acts .rp.on{color:var(--green)}
.post.big{cursor:default;flex-direction:column}
.post.big .text{font-size:19px}
.post.big .meta{color:var(--muted);font-size:13px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
.post.big .top{display:flex;gap:12px;align-items:center}
.banner{height:110px;background:linear-gradient(135deg,#1b2b52,#0f1b36 55%,#3a2a08)}
.prof{padding:0 16px 14px;border-bottom:1px solid var(--line)}
.prof .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-40px}
.prof h2{margin:10px 0 0;font-size:20px}
.prof .h{color:var(--muted)}
.prof .bio{margin:8px 0}
.prof .stats{display:flex;gap:18px;color:var(--muted);font-size:14px}
.prof .stats b{color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip.on{background:var(--amber);color:#1b1300;border-color:var(--amber);font-weight:700}
.search{padding:12px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;outline:none}
.search input:focus{border-color:var(--amber)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.notif{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.notif.new{background:rgba(255,176,32,.06)}
.notif .ic{font-size:20px;width:30px;text-align:center}
.notif p{margin:2px 0 0;color:var(--muted);font-size:14px}
.demo{background:#2a2108;color:var(--amber2);font-size:12px;text-align:center;padding:6px 10px}
.bottom{display:none}
@media (max-width:1020px){
.shell{grid-template-columns:72px minmax(0,1fr)}
.right{display:none}
.side .lbl,.me-chip div{display:none}
.side .brand span.w{display:none}
.nav a{justify-content:center;padding:12px}
.badge{position:absolute;margin:-18px 0 0 18px}
.side .btn{padding:10px 0;font-size:0}
.side .btn:before{content:"✎";font-size:18px}
}
@media (max-width:700px){
.shell{display:block}
.side{display:none}
main{border:0;padding-bottom:64px}
.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:10}
.bottom a{flex:1;text-align:center;padding:12px 0;font-size:21px;position:relative;cursor:pointer;color:var(--muted)}
.bottom a.on{color:var(--amber)}
.bottom .badge{position:absolute;top:6px;margin:0 0 0 4px;font-size:10px}
}
.vb{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#06101f;font-size:10px;font-weight:900;margin-left:2px}
.okmsg{background:rgba(61,220,151,.12);color:var(--green);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;z-index:50;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.auth .tabs button{padding:10px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
var SB_URL="https://lodaopndsdahfcenrzxj.supabase.co";
var SB_KEY="sb_publishable_ndTUVlOvFaFcHtCOQTClcQ_iWJN3W7H";
var MAX=280;
var APP=document.getElementById("app");
if(!window.supabase){
APP.innerHTML='<div class="empty" style="padding:60px 20px">Bağlantı kütüphanesi yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.</div>';
return;
}
var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
var ROLES=[
{k:"pilot",n:"Pilot",c:"#5aa9ff"},
{k:"kabin",n:"Kabin Ekibi",c:"#ff8fb3"},
{k:"occ",n:"OCC / Dispeçer",c:"#ffb020"},
{k:"teknik",n:"Teknisyen",c:"#3ddc97"},
{k:"atc",n:"ATC",c:"#c39bff"},
{k:"yer",n:"Yer Hizmetleri",c:"#ff9f5a"},
{k:"ogrenci",n:"Öğrenci Pilot",c:"#7fe0e6"}
];
function role(k){for(var i=0;i<ROLES.length;i++)if(ROLES[i].k===k)return ROLES[i];return ROLES[0];}
var S={
view:"home",param:null,tab:"all",filter:"all",q:"",draft:"",replyDraft:"",stack:[],
mode:"login",authErr:"",authInfo:"",form:{},busy:false,boot:true,recovery:false,
me:null,posts:[],replies:[],parent:null,post:null,prof:null,pstats:null,notifs:[],
trend:[],sugg:[],unread:0,follows:{},loading:false,toast:"",tok:0,ch:null
};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function hash(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function ago(ts){
var s=Math.floor((Date.now()-ts)/1000);
if(s<60)return "şimdi";
var m=Math.floor(s/60);if(m<60)return m+" dk";
var h=Math.floor(m/60);if(h<24)return h+" sa";
var d=Math.floor(h/24);if(d<7)return d+" g";
return new Date(ts).toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
}
function fullDate(ts){return new Date(ts).toLocaleString("tr-TR",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"long",year:"numeric"});}
var TAGCH="A-Za-z0-9_çğıöşüÇĞİÖŞÜ";
function rich(text){
var t=esc(text);
t=t.replace(new RegExp("#(["+TAGCH+"]+)","g"),'<span class="tag" data-tag="$1">#$1</span>');
t=t.replace(new RegExp("@(["+TAGCH+"]+)","g"),'<span class="mention" data-user="$1">@$1</span>');
return t;
}
function toast(msg){S.toast=msg;render();setTimeout(function(){if(S.toast===msg){S.toast="";render();}},3500);}
function P(r){
return {id:r.id,p:r.parent_id,t:r.body,ts:new Date(r.created_at).getTime(),h:r.handle,n:r.display_name,r:r.role,v:!!r.is_verified,
lc:Number(r.like_count)||0,rc:Number(r.repost_count)||0,cc:Number(r.reply_count)||0,lk:!!r.liked_by_me,rp:!!r.reposted_by_me};
}
function allPostRefs(){
var a=[].concat(S.posts,S.replies);
if(S.post)a.push(S.post);
if(S.parent)a.push(S.parent);
return a;
}
function errText(e){
var m=(e&&e.message)||"Bilinmeyen hata";
if(/Invalid login credentials/i.test(m))return "E-posta veya şifre hatalı.";
if(/already registered|already been registered/i.test(m))return "Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.";
if(/Database error/i.test(m))return "Kayıt oluşturulamadı: kullanıcı adı alınmış olabilir ya da bilgiler geçersiz.";
if(/Password should be/i.test(m))return "Şifre en az 6 karakter olmalı.";
if(/different from the old password/i.test(m))return "Yeni şifre eskisinden farklı olmalı.";
if(/rate limit/i.test(m))return "Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.";
if(/valid email|invalid email/i.test(m))return "Geçerli bir e-posta gir.";
return m;
}
async function loadSide(){
if(!S.me)return;
var res=await Promise.all([
sb.from("trending_tags").select("*"),
sb.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",S.me.id).eq("read",false),
sb.from("follows").select("followee:profiles!follows_followee_id_fkey(handle)").eq("follower_id",S.me.id),
sb.from("profiles").select("handle,display_name,role").neq("id",S.me.id).order("created_at",{ascending:false}).limit(30)
]);
S.trend=(res[0].data||[]).slice(0,6);
S.unread=res[1].count||0;
S.follows={};
(res[2].data||[]).forEach(function(f){if(f.followee)S.follows[f.followee.handle]=true;});
S.sugg=(res[3].data||[]).filter(function(x){return !S.follows[x.handle];}).slice(0,4);
}
async function loadView(silent){
if(!S.me)return;
var tok=++S.tok;
if(!silent){S.loading=true;render();}
try{
if(S.view==="home"||S.view==="explore"){
var q=sb.from("post_feed").select("*").is("parent_id",null).order("created_at",{ascending:false}).limit(60);
if(S.view==="home"&&S.tab==="follow"){
var hs=Object.keys(S.follows);hs.push(S.me.handle);
q=q.in("handle",hs);
}
if(S.view==="explore"){
if(S.filter!=="all")q=q.eq("role",S.filter);
var term=S.q.trim().replace(/[,()%*]/g," ");
if(term)q=q.or("body.ilike.%"+term+"%,handle.ilike.%"+term+"%,display_name.ilike.%"+term+"%");
}
var r=await q;if(tok!==S.tok)return;
S.posts=(r.data||[]).map(P);
} else if(S.view==="thread"){
var r1=await sb.from("post_feed").select("*").eq("id",S.param).maybeSingle();
if(tok!==S.tok)return;
S.post=r1.data?P(r1.data):null;S.parent=null;S.replies=[];
if(S.post){
var jobs=[sb.from("post_feed").select("*").eq("parent_id",S.post.id).order("created_at",{ascending:true})];
if(S.post.p)jobs.push(sb.from("post_feed").select("*").eq("id",S.post.p).maybeSingle());
var rr=await Promise.all(jobs);if(tok!==S.tok)return;
S.replies=(rr[0].data||[]).map(P);
if(rr[1]&&rr[1].data)S.parent=P(rr[1].data);
}
} else if(S.view==="tag"){
var rt=await sb.from("post_tags").select("post_id").eq("tag",String(S.param).toLowerCase()).limit(100);
var ids=(rt.data||[]).map(function(x){return x.post_id;});
if(ids.length){
var rp=await sb.from("post_feed").select("*").in("id",ids).order("created_at",{ascending:false});
if(tok!==S.tok)return;
S.posts=(rp.data||[]).map(P);
} else S.posts=[];
} else if(S.view==="profile"){
var h=S.param||S.me.handle;
var rpf=await sb.from("profiles").select("*").eq("handle",h).maybeSingle();
if(tok!==S.tok)return;
S.prof=rpf.data||null;S.posts=[];S.pstats=null;
if(S.prof){
var rs=await Promise.all([
sb.from("post_feed").select("*").eq("handle",S.prof.handle).order("created_at",{ascending:false}).limit(60),
sb.from("follows").select("follower_id",{count:"exact",head:true}).eq("followee_id",S.prof.id),
sb.from("follows").select("followee_id",{count:"exact",head:true}).eq("follower_id",S.prof.id)
]);
if(tok!==S.tok)return;
S.posts=(rs[0].data||[]).map(P);
S.pstats={fl:rs[1].count||0,fg:rs[2].count||0};
}
} else if(S.view==="notifs"){
var rn=await sb.from("notifications").select("id,type,read,created_at,post_id,actor:profiles!notifications_actor_id_fkey(handle,display_name,role),post:posts(body)").eq("user_id",S.me.id).order("created_at",{ascending:false}).limit(50);
if(tok!==S.tok)return;
S.notifs=rn.data||[];
if(S.notifs.some(function(n){return !n.read;})){
sb.from("notifications").update({read:true}).eq("user_id",S.me.id).eq("read",false).then(function(){S.unread=0;render();});
}
}
await loadSide();
}catch(e){
console.error(e);
if(tok===S.tok)S.toast="Veri yüklenemedi. Bağlantını kontrol et.";
}
if(tok===S.tok){S.loading=false;render();}
}
async function setSession(session){
if(!session){
S.me=null;S.boot=false;
if(S.ch){sb.removeChannel(S.ch);S.ch=null;}
render();return;
}
if(S.me&&S.me.id===session.user.id)return;
var r=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
S.boot=false;
if(!r.data){S.authErr="Profil bulunamadı. Çıkış yapıp tekrar kayıt olmayı dene.";S.me=null;render();return;}
S.me=r.data;S.view="home";S.param=null;S.stack=[];
startRealtime();
loadView();
}
var refreshTimer=null;
function scheduleRefresh(){
clearTimeout(refreshTimer);
refreshTimer=setTimeout(function(){loadView(true);},600);
}
function startRealtime(){
if(S.ch||!S.me)return;
S.ch=sb.channel("squawk-live")
.on("postgres_changes",{event:"INSERT",schema:"public",table:"posts"},scheduleRefresh)
.on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+S.me.id},scheduleRefresh)
.subscribe();
}
async function doLogin(){
var f=S.form;
if(!f.email||!f.password){S.authErr="E-posta ve şifreni gir.";render();return;}
S.busy=true;S.authErr="";render();
var r=await sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});
S.busy=false;
if(r.error){S.authErr=errText(r.error);render();}
}
async function doRegister(){
var f=S.form,h=(f.handle||"").trim().replace(/^@/,""),n=(f.name||"").trim();
var err="";
if(!/^[A-Za-z0-9_]{3,20}$/.test(h))err="Kullanıcı adı 3-20 karakter olmalı (harf, rakam, alt çizgi).";
else if(n.length<2)err="Görünen ad en az 2 karakter olmalı.";
else if(!f.email)err="E-posta gir.";
else if(!f.password||f.password.length<6)err="Şifre en az 6 karakter olmalı.";
if(err){S.authErr=err;render();return;}
S.busy=true;S.authErr="";S.authInfo="";render();
var r=await sb.auth.signUp({
email:f.email.trim(),password:f.password,
options:{data:{handle:h,display_name:n,role:f.role||"pilot",bio:(f.bio||"").trim().slice(0,120)}}
});
S.busy=false;
if(r.error){S.authErr=errText(r.error);render();return;}
if(!r.data.session){S.authInfo="Kaydın alındı. E-postana gelen bağlantıyla hesabını onayla, sonra giriş yap.";S.mode="login";render();}
}
async function doLogout(){await sb.auth.signOut();}
async function doForgot(){
var email=(S.form.email||"").trim();
if(!email){S.authErr="E-posta adresini gir.";render();return;}
S.busy=true;S.authErr="";S.authInfo="";render();
var r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
S.busy=false;
if(r.error){S.authErr=errText(r.error);}

async function doRecover(){

S.busy=true;S.authErr="";render();
var r=await sb.auth.updateUser({password:pw});

if(r.error){S.authErr=errText(r.error);render();return;}
S.form.newpw="";S.recovery=false;S.authInfo="";
try{history.replaceState(null,"",location.pathname);}catch(e){}

async function send(parent){

S.busy=true;render();

:await sb.from("likes").insert({user_id:S.me.id,post_id:id});

async function toggleRepost(id){

function act(el){
var a=el.getAttribute("data-act"),id=el.getAttribute("data-id"),v=el.getAttribute("data-v"),uh=el.getAttribute("data-user")||el.getAttribute("data-h");
switch(a){
case "mode":S.mode=v;S.authErr="";S.authInfo="";render();break;
case "login":doLogin();break;
case "sendReset":doForgot();break;
case "saveNewPw":doRecover();break;
case "register":doRegister();break;
case "logout":doLogout();break;
case "nav":S.stack=[];go(v,v==="profile"?S.me.handle:null,true);break;
case "tab":S.tab=v;loadView();break;
case "filter":S.filter=v;loadView();break;
case "like":toggleLike(id);break;
case "rp":toggleRepost(id);break;
case "open":go("thread",id);break;
case "profile":go("profile",uh);break;
case "follow":toggleFollow(uh);break;
case "back":back();break;
case "compose":S.stack=[];S.tab="all";S.view="home";S.param=null;loadView();setTimeout(function(){var d=document.getElementById("draft");if(d)d.focus();},50);break;
case "send":send(null);break;
case "sendReply":send(S.param);break;
}
}
